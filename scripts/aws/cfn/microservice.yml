AWSTemplateFormatVersion: 2010-09-09
Description: Microservice resources for pn-pdf-normalizer-integration

Parameters:
  ProjectName:
    Type: String
    Default: pn
  EnvType:
    Type: String
    AllowedValues:
      - dev
      - test
      - uat
      - hotfix
      - prod
    Default: dev
  Version:
    Type: String
    Default: ''
  LambdasBucketName:
    Type: String
  BucketBasePath:
    Type: String
  BeyondocPdfRemediationImageUri:
    Type: String
  BeyondocWorkerImageUri:
    Type: String
  TemplateBucketBaseUrl:
    Type: String
  AlarmSNSTopicArn:
    Type: String
  PdfRasterECSClusterName:
    Type: String
  PdfRasterApplicationLoadBalancerListenerArn:
    Type: String
  PdfRasterWebappSecurityGroupId:
    Type: String
  PdfRasterVpcId:
    Type: String
  PdfRasterVpcSubnets:
    Type: String
  PdfRasterDefaultSecurityGroup:
    Type: String
  ServiceEndpointToPdfRaster:
    Type: String
  RdsEndpointAddress:
    Type: String
    Description: RDS Cluster Endpoint Address (from storage stack)
  RdsPort:
    Type: Number
    Description: RDS Cluster Port (from storage stack)
  RdsDbName:
    Type: String
    Description: RDS Database Name (from storage stack)
  SvcUserSecretArn:
    Type: String
    Description: ARN of the Secret Manager secret for RDS service user (from storage stack)
  SvcUsername:
    Type: String
    Description: RDS service user username (from storage stack)
  RdsSecurityGroupId:
    Type: String
    Description: ID of the Security Group attached to the RDS cluster (from storage stack)
  BeyondocApiUrl:
      Type: String
      Description: Url API BEYONDOC
  NormalizerMargins:
      Type: String
      Description: Margin Default Pdf
  PnSsStagingBucketPrefix:
    Type: String
    Description: Base prefix for SafeStorage bucket name
    Default: pn-safestorage-staging
  PnSsKmsKeyTagValue:
    Type: String
    Default: PnSsKmsBucket
  PnPdfNormalizerTransformationHandlerLambdaName:
    Type: String
    Description: 'Nome della Lambda function che gestisce i messaggi in entrata dalla coda pn-pdf-normalizer-transformation-queue'
    Default: 'NormalizerTransformationHandler'
  PnPdfNormalizerTransformationQueueName:
    Type: String
    Description: 'Queue name for the normalization queue'
  PnPdfNormalizerTransformationQueueArn:
    Type: String
    Description: 'Queue ARN for the normalization queue'
  NormalizerTransformationHandlerReservedConcurrency:
    Type: Number
    Default: 5
  NormalizerTransformationHandlerMemorySize:
    Type: Number
    Default: 512
  NormalizerTransformationHandlerTimeout:
    Type: Number
    Default: 60
  LambdaListenerPort:
    Type: Number
    Default: 8080
  PdfRasterApplicationLoadBalancerAwsDns:
    Type: String
    Description: DNS name of the PdfRaster Application Load Balancer
  PdfRasterAlbProtocol:
    Type: String
    Default: http
    AllowedValues:
      - http
      - https
  RdsClusterIdentifierSuffix:
    Type: String
    Description: Suffix to make RDS cluster unique
  BeyondocPdfRemediationCpu:
    Type: Number
    Default: 1024
  BeyondocPdfRemediationMemory:
    Type: String
    Default: 2GB
  RemediationAlbPath:
    Type: String
    Default: /beyondoc/api/v1/notify-input-pdf-uploaded*
  RemediationHealthCheckPath:
    Type: String
    Default: '/actuator/health'
  RemediationAlbPriority:
    Type: Number
    Default: 110
  WorkerAlbPriority:
    Type: Number
    Default: 115
    Description: ALB listener rule priority for Worker service (if exposed)
  BeyondocWorkerCpu:
    Type: Number
    Default: 1024
  BeyondocWorkerMemory:
    Type: String
    Default: 2GB
  BeyondocPdfRemediationMinTasks:
    Type: Number
    Default: 1
  BeyondocPdfRemediationMaxTasks:
    Type: Number
    Default: 2
  BeyondocWorkerMinTasks:
    Type: Number
    Default: 1
  BeyondocWorkerMaxTasks:
    Type: Number
    Default: 2
  EcsScalingEvaluationPeriods:
    Type: Number
    Default: 5
  RemediationScalingStrategy:
    Type: String
    Default: REST-API
    AllowedValues:
      - CUSTOM
      - Disabled
      - REST-API
      - SQS
  RemediationScalingThresholdRequests:
    Type: Number
    Default: 100 #placeholder tbd
  WorkerScalingStrategy:
    Type: String
    Default: CUSTOM
    AllowedValues:
      - CUSTOM
      - Disabled
      - REST-API
      - SQS
  WorkerCpuScalingThreshold:
    Type: Number
    Default: 70
  WorkerMemoryScalingThreshold:
    Type: Number
    Default: 75
  BeyondocPdfRemediationDisableOtel:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  BeyondocWorkerDisableOtel:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  BeyondocPdfRemediationMountEfs:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  BeyondocWorkerMountEfs:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  EfsFilesystemId:
    Type: String
    Default: '-'
  LambdaDataPointsToAlarm:
    Type: Number
    Default: 1
  LambdaEvaluationPeriods:
    Type: Number
    Default: 1
  EcsMemoryAlarmThreshold:
    Type: Number
    Default: 80
  EcsMemoryAlarmEvaluationPeriods:
    Type: Number
    Default: 5
  BeyondocPdfRemediationLogGroupName:
    Type: String
    Description: Log Group name for pdf-remediation-service (from storage stack)
  BeyondocWorkerLogGroupName:
    Type: String
    Description: Log Group name for doc-worker-service (from storage stack)

  PnPdfNormalizerTransformationCallbackLambdaName:
    Type: String
    Default: NormalizerTransformationCallback
  PnPdfNormalizerTransformationCallbackReservedConcurrency:
    Type: Number
    Default: 5
  PnPdfNormalizerTransformationCallbackMemorySize:
    Type: Number
    Default: 512
  PnPdfNormalizerTransformationCallbackTimeout:
    Type: Number
    Default: 60
  PnPdfNormalizerTransformationCallbackLambdaAlbPath:
    Type: String
    Description: Path for the PnPdfNormalizerTransformationCallback Lambda
  PnPdfNormalizerTransformationCallbackLambdaAlbPriority:
    Type: Number
    Default: 105


Conditions:
  IsRemediationScalingEnabled: !Not
    - !Equals
      - !Ref RemediationScalingStrategy
      - Disabled
  IsWorkerScalingEnabled: !Not
    - !Equals
      - !Ref WorkerScalingStrategy
      - Disabled
  IsWorkerScalingCustom: !Equals
    - !Ref WorkerScalingStrategy
    - CUSTOM

Resources:
  PnPdfNormalizerTransformationHandlerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub pn-pdf-normalizer-integration-TransformationHandlerRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  PnPdfNormalizerTransformationCallbackLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub pn-pdf-normalizer-integration-TransformationCallbackRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PnPdfNormalizerTransformationCallbackLambdaPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub pn-pdf-normalizer-integration-PnPdfNormalizerTransformationCallbackLambdaPolicy
      Roles:
        - !Ref PnPdfNormalizerTransformationCallbackLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowS3AccessSafeStorage
            Effect: Allow
            Action:
              - s3:GetObject*
              - s3:PutObjectTagging
              - s3:List*
              - s3:GetBucket*
            Resource:
              - !Sub arn:aws:s3:::${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}
              - !Sub arn:aws:s3:::${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}/*
          - Sid: AllowKMSAccessSafeStorage
            Effect: Allow
            Action:
              - kms:Decrypt
            Resource: '*'
            Condition:
                StringEquals:
                  aws:ResourceTag/KeyType: !Ref PnSsKmsKeyTagValue

  PnPdfNormalizerTransformationHandlerLambdaPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub pn-pdf-normalizer-integration-PnPdfNormalizerTransformationHandlerLambdaPolicy
      Roles:
        - !Ref PnPdfNormalizerTransformationHandlerLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: 'GetInvokeSQS'
            Effect: 'Allow'
            Action:
              - 'sqs:ReceiveMessage'
              - 'sqs:DeleteMessage'
              - 'sqs:Get*'
              - 'sqs:List*'
              - 'sqs:SendMessage'
            Resource:
              - !Ref PnPdfNormalizerTransformationQueueArn
          - Sid: AllowS3AccessSafeStorage
            Effect: Allow
            Action:
              - 's3:GetObject*'
              - 's3:List*'
              - 's3:GetBucket*'
            Resource:
              - !Sub arn:aws:s3:::${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}
              - !Sub arn:aws:s3:::${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}/*
          - Sid: 'DefaultKMSGrantRead'
            Effect: 'Allow'
            Action:
              - 'kms:GenerateDataKey'
              - 'kms:Decrypt'
            Resource: '*'
            Condition:
              StringLike:
                kms:RequestAlias: 'alias/aws/sqs'
          - Effect: Allow
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'

            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/KeyType: !Ref PnSsKmsKeyTagValue

  PnPdfNormalizerTransformationCallbackLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub pn-pdf-normalizer-integration-${PnPdfNormalizerTransformationCallbackLambdaName}
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt PnPdfNormalizerTransformationCallbackLambdaRole.Arn
      Code:
        S3Bucket: !Ref LambdasBucketName
        S3Key: !Sub ${BucketBasePath}/NormalizerTransformationCallback.zip
      MemorySize: !Ref PnPdfNormalizerTransformationCallbackMemorySize
      Timeout: !Ref PnPdfNormalizerTransformationCallbackTimeout
      ReservedConcurrentExecutions: !Ref PnPdfNormalizerTransformationCallbackReservedConcurrency
      Tags:
        - Key: Name
          Value: !Sub pn-pdf-normalizer-integration-${PnPdfNormalizerTransformationCallbackLambdaName}
        - Key: Environment
          Value: !Ref EnvType

  PnPdfNormalizerTransformationHandlerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub pn-pdf-normalizer-integration-${PnPdfNormalizerTransformationHandlerLambdaName}
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt PnPdfNormalizerTransformationHandlerLambdaRole.Arn
      VpcConfig:
        SubnetIds:
          - !Select [ 0, !Split [ ",", !Ref PdfRasterVpcSubnets ] ]
          - !Select [ 1, !Split [ ",", !Ref PdfRasterVpcSubnets ] ]
          - !Select [ 2, !Split [ ",", !Ref PdfRasterVpcSubnets ] ]
        SecurityGroupIds:
          - !GetAtt EcsPdfNormalizerDefaultSecurityGroup.GroupId
      Code:
        S3Bucket: !Ref LambdasBucketName
        S3Key: !Sub ${BucketBasePath}/NormalizerTransformationHandler.zip
      MemorySize: !Ref NormalizerTransformationHandlerMemorySize
      Timeout: !Ref NormalizerTransformationHandlerTimeout
      ReservedConcurrentExecutions: !Ref NormalizerTransformationHandlerReservedConcurrency
      Environment:
        Variables:
          BEYONDOC_API_URL: !Sub ${PdfRasterAlbProtocol}://${PdfRasterApplicationLoadBalancerAwsDns}${BeyondocApiUrl}
          BEYONDOC_API_PROTOCOL: !Sub ${PdfRasterAlbProtocol}
          NORMALIZER_MARGINS : !Sub ${NormalizerMargins}
      Tags:
        - Key: Name
          Value: !Sub pn-pdf-normalizer-integration-${PnPdfNormalizerTransformationHandlerLambdaName}
        - Key: Environment
          Value: !Ref EnvType

  PnPdfNormalizerTransformationHandlerTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10 # 10 is default
      Enabled: True
      EventSourceArn: !Ref PnPdfNormalizerTransformationQueueArn
      FunctionName: !Ref PnPdfNormalizerTransformationHandlerLambda
      FunctionResponseTypes:
        - ReportBatchItemFailures
      MaximumBatchingWindowInSeconds: 0 #default value

  PnPdfNormalizerTransformationCallbackTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub lambda-callback-tg-${EnvType}
      TargetType: lambda
      Targets:
        - Id: !GetAtt PnPdfNormalizerTransformationCallbackLambda.Arn
      HealthCheckEnabled: false
      Tags:
        - Key: Environment
          Value: !Ref EnvType

  PnPdfNormalizerTransformationCallbackLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PnPdfNormalizerTransformationCallbackLambda.Arn
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com

  PnPdfNormalizerTransformationCallbackListenerRuleLambda:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref PdfRasterApplicationLoadBalancerListenerArn
      Priority: !Ref PnPdfNormalizerTransformationCallbackLambdaAlbPriority
      Actions:
        - Type: forward
          TargetGroupArn: !Ref PnPdfNormalizerTransformationCallbackTargetGroup
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - !Ref PnPdfNormalizerTransformationCallbackLambdaAlbPath

  EcsPdfNormalizerDefaultSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub SG with specific egress for pn-pdf-normalizer-integration Beyondoc tasks
      VpcId: !Ref PdfRasterVpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref RdsPort
          ToPort: !Ref RdsPort
          DestinationSecurityGroupId: !Ref RdsSecurityGroupId
        - IpProtocol: tcp
          FromPort: !Ref LambdaListenerPort
          ToPort: !Ref LambdaListenerPort
          DestinationSecurityGroupId: !Ref PdfRasterWebappSecurityGroupId
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: '-1'
          SourceSecurityGroupId: !Ref PdfRasterDefaultSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub pn-pdf-normalizer-integration-EcsPdfNormalizerDefault-sg
        - Key: Environment
          Value: !Ref EnvType

  EcsPdfNormalizerSelfIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsPdfNormalizerDefaultSecurityGroup
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref EcsPdfNormalizerDefaultSecurityGroup

  BeyondocPdfRemediationTaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub pn-pdfnorm-BeyondocPdfRemediationTaskPolicy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowSecretManagerAccess
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref SvcUserSecretArn
          - Sid: AllowS3AccessSafeStorage
            Effect: Allow
            Action:
              - s3:GetObject*
              - s3:PutObject*
              - s3:List*
            Resource:
              - !Sub arn:aws:s3:::${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}
              - !Sub arn:aws:s3:::${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}/*
          - Sid: AllowKMSAccessSafeStorage
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/KeyType: !Ref PnSsKmsKeyTagValue

  BeyondocWorkerTaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub pn-pdfnorm-BeyondocWorkerTaskPolicy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowSecretManagerAccess
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref SvcUserSecretArn
          - Sid: AllowS3AccessSafeStorage
            Effect: Allow
            Action:
              - s3:GetObject*
              - s3:PutObject*
              - s3:List*
            Resource:
              - !Sub arn:aws:s3:::${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}
              - !Sub arn:aws:s3:::${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}/*
          - Sid: AllowKMSAccessSafeStorage
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/KeyType: !Ref PnSsKmsKeyTagValue

  BeyondocPdfRemediationMicroservice:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub ${TemplateBucketBaseUrl}/fragments/ecs-service.yaml
      Parameters:
        MicroServiceUniqueName: pn-pdf-normalizer-remediation
        ECSClusterName: !Ref PdfRasterECSClusterName
        ContainerImageURI: !Ref BeyondocPdfRemediationImageUri
        CpuValue: !Ref BeyondocPdfRemediationCpu
        MemoryAmount: !Ref BeyondocPdfRemediationMemory
        EcsLogGroup: !Ref BeyondocPdfRemediationLogGroupName
        TaskRoleManagedPolicyArn: !Ref BeyondocPdfRemediationTaskPolicy
        VpcId: !Ref PdfRasterVpcId
        Subnets: !Ref PdfRasterVpcSubnets
        EcsDefaultSecurityGroup: !Ref EcsPdfNormalizerDefaultSecurityGroup
        LoadBalancerListenerArn: !Ref PdfRasterApplicationLoadBalancerListenerArn
        MappedPaths: !Sub ${RemediationAlbPath}
        HealthCheckPath: !Ref RemediationHealthCheckPath
        LoadbalancerRulePriority: !Ref RemediationAlbPriority
        AlbSecurityGroup: !Ref PdfRasterWebappSecurityGroupId
        AutoscalingStrategy: !Ref RemediationScalingStrategy
        MinTasksNumber: !Ref BeyondocPdfRemediationMinTasks
        MaxTasksNumber: !Ref BeyondocPdfRemediationMaxTasks
        AutoscalingThreshold: !Ref RemediationScalingThresholdRequests
        DisableOtelXRay: !Ref BeyondocPdfRemediationDisableOtel
        MountEfs: !Ref BeyondocPdfRemediationMountEfs
        EfsFilesystem: !Ref EfsFilesystemId
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        # Database configuration
        ContainerEnvEntry1: !Sub DB_URL=jdbc:postgresql://${RdsEndpointAddress}:${RdsPort}/${RdsDbName}
        ContainerEnvEntry2: !Sub DB_USERNAME=${SvcUsername}
        ContainerEnvEntry3: DB_DRIVER_CLASS=org.postgresql.Driver
        # HikariCP configuration
        ContainerEnvEntry4: HIKARI_MAX_POOL_SIZE=5
        ContainerEnvEntry5: HIKARI_MINIMUM_IDLE=2
        ContainerEnvEntry6: HIKARI_IDLE_TIMEOUT=300000
        ContainerEnvEntry7: HIKARI_MAX_LIFETIME=600000
        ContainerEnvEntry8: HIKARI_CONNECTION_TIMEOUT=30000
        ContainerEnvEntry9: HIKARI_LEAK_DETECTION_THRESHOLD=60000
        ContainerEnvEntry10: HIKARI_KEEPALIVE_TIME=500000
        ContainerEnvEntry11: HIKARI_INITIALIZATION_FAIL_TIMEOUT=1
        # Server/Tomcat configuration
        ContainerEnvEntry12: SERVER_PORT=8080
        ContainerEnvEntry13: TOMCAT_MAX_THREAD=30
        ContainerEnvEntry14: TOMCAT_SPARE=30
        ContainerEnvEntry15: TOMCAT_MAX_CONNECTION=300
        ContainerEnvEntry16: TOMCAT_ACCEPT_COUNT=100
        # Logging configuration
        ContainerEnvEntry17: LOG_LEVEL=INFO
        # Messaging configuration
        ContainerEnvEntry18: PAC_MESSAGING_ENABLED=false
        # Callback configuration
        ContainerEnvEntry19: !Sub PAC_NOTIFY_URL=${PdfRasterAlbProtocol}://${PdfRasterApplicationLoadBalancerAwsDns}:${LambdaListenerPort}${PnPdfNormalizerTransformationCallbackLambdaAlbPath}
        # S3 configuration
        ContainerEnvEntry20: !Sub S3_BUCKET=${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}
        ContainerEnvEntry21: !Sub S3_URL=https://s3.${AWS::Region}.amazonaws.com
        ContainerEnvEntry22: !Sub S3_REGION=${AWS::Region}
        # Secret configuration
        ContainerSecret1: !Sub 'DB_PASSWORD=${SvcUserSecretArn}:password:AWSCURRENT:'
        MicroServiceSecretPrefix: pn-pdf-normalizer-db-svc-user-credentials

  BeyondocWorkerMicroservice:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub ${TemplateBucketBaseUrl}/fragments/ecs-service-v2.yaml
      Parameters:
        DisableAlbIntegration: true
        MicroServiceUniqueName: pn-pdf-normalizer-worker
        ECSClusterName: !Ref PdfRasterECSClusterName
        ContainerImageURI: !Ref BeyondocWorkerImageUri
        CpuValue: !Ref BeyondocWorkerCpu
        MemoryAmount: !Ref BeyondocWorkerMemory
        EcsLogGroup: !Ref BeyondocWorkerLogGroupName
        TaskRoleManagedPolicyArn: !Ref BeyondocWorkerTaskPolicy
        VpcId: !Ref PdfRasterVpcId
        Subnets: !Ref PdfRasterVpcSubnets
        EcsDefaultSecurityGroup: !Ref EcsPdfNormalizerDefaultSecurityGroup
        MappedPaths: /doc-worker-service/* #placeholder tbd
        AlbSecurityGroup: ''
        AutoscalingStrategy: !Ref WorkerScalingStrategy
        MinTasksNumber: !Ref BeyondocWorkerMinTasks
        MaxTasksNumber: !Ref BeyondocWorkerMaxTasks
        DisableOtelXRay: !Ref BeyondocWorkerDisableOtel
        MountEfs: !Ref BeyondocWorkerMountEfs
        EfsFilesystem: !Ref EfsFilesystemId
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        # Database configuration
        ContainerEnvEntry1: !Sub DB_URL=jdbc:postgresql://${RdsEndpointAddress}:${RdsPort}/${RdsDbName}
        ContainerEnvEntry2: !Sub DB_USERNAME=${SvcUsername}
        ContainerEnvEntry3: DB_DRIVER_CLASS=org.postgresql.Driver
        # HikariCP configuration
        ContainerEnvEntry4: HIKARI_MAX_POOL_SIZE=5
        ContainerEnvEntry5: HIKARI_MINIMUM_IDLE=2
        ContainerEnvEntry6: HIKARI_IDLE_TIMEOUT=300000
        ContainerEnvEntry7: HIKARI_MAX_LIFETIME=600000
        ContainerEnvEntry8: HIKARI_CONNECTION_TIMEOUT=30000
        ContainerEnvEntry9: HIKARI_LEAK_DETECTION_THRESHOLD=60000
        ContainerEnvEntry10: HIKARI_KEEPALIVE_TIME=500000
        ContainerEnvEntry11: HIKARI_INITIALIZATION_FAIL_TIMEOUT=1
        # JPA/Hibernate configuration
        ContainerEnvEntry12: SHOW_SQL=false
        ContainerEnvEntry13: HIBERNATE_LOG_LEVEL=DEBUG
        # Logging configuration
        ContainerEnvEntry14: ROOT_LOG_LEVEL=INFO
        ContainerEnvEntry15: LOG_LEVEL=INFO
        # Worker configuration
        ContainerEnvEntry16: SERVICE_NAME=workerservice
        ContainerEnvEntry17: CRON=*/10 * * * * ?
        ContainerEnvEntry18: A4_TOLERANCE_PERCENTAGE=1
        ContainerEnvEntry19: MAX_OBJECT_NUMBER=5000
        # Messaging configuration
        ContainerEnvEntry20: PAC_MESSAGING_ENABLED=false
        # S3 configuration
        ContainerEnvEntry21: !Sub S3_BUCKET=${PnSsStagingBucketPrefix}-${AWS::Region}-${AWS::AccountId}
        ContainerEnvEntry22: !Sub S3_URL=https://s3.${AWS::Region}.amazonaws.com
        ContainerEnvEntry23: !Sub S3_REGION=${AWS::Region}
        # Secret configuration
        ContainerSecret1: !Sub 'DB_PASSWORD=${SvcUserSecretArn}:password:AWSCURRENT:'
        MicroServiceSecretPrefix: pn-pdf-normalizer-db-svc-user-credentials

  NormalizerTransformationHandlerAlarms:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub ${TemplateBucketBaseUrl}/fragments/lambda-alarms.yaml
      Parameters:
        FunctionName: !Ref PnPdfNormalizerTransformationHandlerLambda
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        DataPointsToAlarm: !Ref LambdaDataPointsToAlarm
        EvaluationPeriods: !Ref LambdaEvaluationPeriods

  BeyondocWorkerCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsWorkerScalingCustom
    Properties:
      AlarmName: !Sub pn-pdfnorm-BeyondocWorker-CPU-Scaling-Alarm-${EnvType}
      AlarmDescription: !Sub Trigger scaling for Worker based on CPU > ${WorkerCpuScalingThreshold}%
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref PdfRasterECSClusterName
        - Name: ServiceName
          Value: !GetAtt BeyondocWorkerMicroservice.Outputs.ServiceName
      Statistic: Average
      Period: 60
      EvaluationPeriods: !Ref EcsScalingEvaluationPeriods
      Threshold: !Ref WorkerCpuScalingThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !GetAtt BeyondocWorkerMicroservice.Outputs.ScaleUpPolicy
      OKActions:
        - !GetAtt BeyondocWorkerMicroservice.Outputs.ScaleDownPolicy

  BeyondocWorkerMemoryAlarmScaling:
    Type: AWS::CloudWatch::Alarm
    Condition: IsWorkerScalingCustom
    Properties:
      AlarmName: !Sub pn-pdfnorm-BeyondocWorker-Memory-Scaling-Alarm-${EnvType}
      AlarmDescription: !Sub Trigger scaling for Worker based on Memory >
        ${WorkerMemoryScalingThreshold}%
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref PdfRasterECSClusterName
        - Name: ServiceName
          Value: !GetAtt BeyondocWorkerMicroservice.Outputs.ServiceName
      Statistic: Average
      Period: 60
      EvaluationPeriods: !Ref EcsScalingEvaluationPeriods
      Threshold: !Ref WorkerMemoryScalingThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !GetAtt BeyondocWorkerMicroservice.Outputs.ScaleUpPolicy
      OKActions:
        - !GetAtt BeyondocWorkerMicroservice.Outputs.ScaleDownPolicy

  BeyondocPdfRemediationMemoryNotifyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub pn-pdfnorm-BeyondocPdfRemediation-Memory-Notify-Alarm-${EnvType}
      AlarmDescription: !Sub Notify if PdfRemediation Memory > ${EcsMemoryAlarmThreshold}%
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref PdfRasterECSClusterName
        - Name: ServiceName
          Value: !GetAtt BeyondocPdfRemediationMicroservice.Outputs.ServiceName
      Statistic: Average
      Period: 60
      EvaluationPeriods: !Ref EcsMemoryAlarmEvaluationPeriods
      Threshold: !Ref EcsMemoryAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      OKActions:
        - !Ref AlarmSNSTopicArn
      TreatMissingData: breaching
  BeyondocWorkerMemoryNotifyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub pn-pdfnorm-BeyondocWorker-Memory-Notify-Alarm-${EnvType}
      AlarmDescription: !Sub Notify if Worker Memory > ${EcsMemoryAlarmThreshold}%
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref PdfRasterECSClusterName
        - Name: ServiceName
          Value: !GetAtt BeyondocWorkerMicroservice.Outputs.ServiceName
      Statistic: Average
      Period: 60
      EvaluationPeriods: !Ref EcsMemoryAlarmEvaluationPeriods
      Threshold: !Ref EcsMemoryAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      OKActions:
        - !Ref AlarmSNSTopicArn
      TreatMissingData: breaching

Outputs:
  NormalizerTransformationHandlerArn:
